<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--app-head-->
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/inter-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#ffffff">
  <script>
    // Scroll reveals start hidden only when the app can show them; if the
    // script never runs, everything stays visible.
    document.documentElement.classList.add('js');
    setTimeout(() => { if (!window.vpReady) document.documentElement.classList.remove('js'); }, 2500);
  </script>
  <script type="module" src="/src/entry-client.tsx"></script>
</head>
<body>
  <div id="root"><!--app-html--></div>
</body>
</html>
